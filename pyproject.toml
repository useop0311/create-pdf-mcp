[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "create-pdf-mcp"
version = "0.1.0"
description = "MCP server for generating Korean Math & Physics exam/worksheet PDFs using Typst and 3-tier vector figure rendering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typst>=0.12.0",
    "sympy>=1.13.0",
    "numpy>=2.0.0",
    "boto3>=1.35.0",
    "qrcode[pil]>=8.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
create-pdf-mcp = "create_pdf_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/create_pdf_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
